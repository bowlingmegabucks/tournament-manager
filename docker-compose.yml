services:

  db:
    container_name: db
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: tournament_manager
      MARIADB_USER: app
      MARIADB_PASSWORD: app
    ports:
      - "13306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./tsconfig.base.json:/tsconfig.base.json:ro
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: tournament_manager
      DB_USER: app
      DB_PASSWORD: app
    env_file:
      - path: ./server/.env.docker
        required: false
    depends_on:
      db:
        condition: service_healthy

  client:
    container_name: client
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - /app/node_modules
      - ./tsconfig.base.json:/tsconfig.base.json:ro
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  db_data:
