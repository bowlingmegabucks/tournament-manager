name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  client:
    name: Client (lint · typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: ./node_modules/.bin/tsc -b

      - name: Test
        run: npm test

  server:
    name: Server (typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Test
        run: npm test

  mutation-client:
    name: Client mutation
    needs: client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Mutation test
        run: npm run test:mutation

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report-client
          path: client/reports/mutation/

  mutation-server:
    name: Server mutation
    needs: server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Mutation test
        run: npm run test:mutation

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report-server
          path: server/reports/mutation/
